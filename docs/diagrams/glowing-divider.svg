<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 32" width="100%" height="100%">
  <defs>
    <!-- Ultra-Sleek Professional Tapered Gradient -->
    <linearGradient id="proTaperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </linearGradient>

    <!-- Center Ambient Flare (Soft, non-distracting) -->
    <radialGradient id="centerSoftAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Optical Glow Filter -->
    <filter id="subtleOpticalGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes elegantBreath {
        0%, 100% {
          opacity: 0.65;
        }
        50% {
          opacity: 1;
        }
      }
      .elegant-line {
        animation: elegantBreath 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="elegant-line">
    <!-- Center Ambient Soft Halo -->
    <ellipse cx="550" cy="16" rx="140" ry="10" fill="url(#centerSoftAura)" />

    <!-- 1px Precision Laser Baseline -->
    <line x1="80" y1="16" x2="1020" y2="16" stroke="url(#proTaperGrad)" stroke-width="1" filter="url(#subtleOpticalGlow)" />
    <line x1="160" y1="16" x2="940" y2="16" stroke="url(#proTaperGrad)" stroke-width="0.75" />

    <!-- Subtle Tech Axis Markers (Left and Right Ticks) -->
    <line x1="320" y1="13" x2="320" y2="19" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <line x1="780" y1="13" x2="780" y2="19" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

    <!-- Center Minimalist Diamond Nexus Core -->
    <g transform="translate(550, 16)">
      <!-- Outer Accent Ring -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" />
      <!-- Sharp Diamond Core -->
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#ffffff" filter="url(#subtleOpticalGlow)" />
    </g>
  </g>
</svg>
