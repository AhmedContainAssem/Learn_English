<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPillars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1100" height="240" fill="url(#bgPillars)" rx="16" />

  <text x="550" y="38" fill="#00f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3">FOUNDATIONAL ARCHITECTURE</text>
  <text x="550" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">⚡ THE FOUR CORE PILLARS</text>

  <!-- 4 Cards -->
  <!-- 1 -->
  <g transform="translate(40, 90)">
    <rect width="235" height="120" rx="12" fill="url(#cardBg)" stroke="#00f3ff" stroke-width="1.2" />
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#00f3ff" stroke-width="1.5" />
    <text x="35" y="42" font-size="16" text-anchor="middle">🎨</text>
    <text x="65" y="38" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">1 Teacher Studio</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Visual lesson creator with</text>
    <text x="20" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11.5">instant live simulator &amp; sync.</text>
    <rect x="20" y="105" width="60" height="4" rx="2" fill="url(#cyanGrad)" />
  </g>

  <!-- 2 -->
  <g transform="translate(295, 90)">
    <rect width="235" height="120" rx="12" fill="url(#cardBg)" stroke="#ff007a" stroke-width="1.2" />
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#ff007a" stroke-width="1.5" />
    <text x="35" y="42" font-size="16" text-anchor="middle">📚</text>
    <text x="65" y="38" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">7 Archetypes</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Tabs, 3D Storybooks, Quizzes,</text>
    <text x="20" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Flashcards, and Portals.</text>
    <rect x="20" y="105" width="60" height="4" rx="2" fill="url(#pinkGrad)" />
  </g>

  <!-- 3 -->
  <g transform="translate(550, 90)">
    <rect width="235" height="120" rx="12" fill="url(#cardBg)" stroke="#00ff66" stroke-width="1.2" />
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#00ff66" stroke-width="1.5" />
    <text x="35" y="42" font-size="16" text-anchor="middle">⚡</text>
    <text x="65" y="38" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">0 Backend Cost</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11.5">100% Client-Side Jamstack</text>
    <text x="20" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11.5">with embedded self-storage.</text>
    <rect x="20" y="105" width="60" height="4" rx="2" fill="url(#greenGrad)" />
  </g>

  <!-- 4 -->
  <g transform="translate(805, 90)">
    <rect width="255" height="120" rx="12" fill="url(#cardBg)" stroke="#fbbf24" stroke-width="1.2" />
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="35" y="42" font-size="16" text-anchor="middle">❤️</text>
    <text x="65" y="38" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">1 Mission</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Dedicated to empowering</text>
    <text x="20" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11.5">students and educators.</text>
    <rect x="20" y="105" width="60" height="4" rx="2" fill="url(#yellowGrad)" />
  </g>
</svg>
