<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSnap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanSnap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1100" height="280" fill="url(#bgSnap)" rx="16" />

  <text x="550" y="36" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3">CORE SPECIFICATIONS</text>
  <text x="550" y="62" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">📊 RUNTIME SNAPSHOT</text>

  <!-- Table Grid -->
  <g transform="translate(50, 85)">
    <!-- Header -->
    <rect width="1000" height="36" rx="8" fill="#1e293b" />
    <text x="30" y="23" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800">DIMENSION</text>
    <text x="500" y="23" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800">RUNTIME IMPLEMENTATION</text>
    <text x="880" y="23" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800">STATUS</text>

    <!-- Row 1 -->
    <g transform="translate(0, 42)">
      <rect width="1000" height="28" fill="#111827" fill-opacity="0.6" rx="6" />
      <text x="30" y="19" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🌐 Architecture</text>
      <text x="500" y="19" fill="#94a3b8" font-family="sans-serif" font-size="12">100% Client-Side Jamstack (Static ES Modules)</text>
      <rect x="880" y="5" width="85" height="18" rx="9" fill="#065f46" />
      <text x="922" y="18" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ZERO SERVER</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 74)">
      <rect width="1000" height="28" fill="#0f172a" fill-opacity="0.6" rx="6" />
      <text x="30" y="19" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🔊 Voice &amp; TTS</text>
      <text x="500" y="19" fill="#94a3b8" font-family="sans-serif" font-size="12">Web Speech API (<tspan fill="#00f3ff" font-family="monospace">SpeechSynthesis</tspan>) Isolated Engine</text>
      <rect x="880" y="5" width="85" height="18" rx="9" fill="#1e3a8a" />
      <text x="922" y="18" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">NATIVE TTS</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 106)">
      <rect width="1000" height="28" fill="#111827" fill-opacity="0.6" rx="6" />
      <text x="30" y="19" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🎵 Sound FX</text>
      <text x="500" y="19" fill="#94a3b8" font-family="sans-serif" font-size="12">Web Audio API (<tspan fill="#ff79c6" font-family="monospace">AudioContext</tspan>) Frequency Oscillators</text>
      <rect x="880" y="5" width="85" height="18" rx="9" fill="#581c87" />
      <text x="922" y="18" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">SYNTHESIZED</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 138)">
      <rect width="1000" height="28" fill="#0f172a" fill-opacity="0.6" rx="6" />
      <text x="30" y="19" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🗂️ Lesson Storage</text>
      <text x="500" y="19" fill="#94a3b8" font-family="sans-serif" font-size="12">Self-Contained Embedded JSON Payloads (<tspan fill="#fbbf24" font-family="monospace">#studio-payload</tspan>)</text>
      <rect x="880" y="5" width="85" height="18" rx="9" fill="#78350f" />
      <text x="922" y="18" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">SELF-HEAL</text>
    </g>
  </g>
</svg>
