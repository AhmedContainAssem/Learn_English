<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrinc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1100" height="240" fill="url(#bgPrinc)" rx="16" />

  <text x="550" y="38" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3">QUALITY &amp; ETHICS</text>
  <text x="550" y="66" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">🧩 CORE DESIGN PRINCIPLES</text>

  <!-- 4 Cards -->
  <g transform="translate(40, 95)">
    <rect width="235" height="115" rx="12" fill="url(#cardP)" stroke="#00f3ff" stroke-width="1.2" />
    <text x="20" y="32" fill="#00f3ff" font-family="sans-serif" font-size="15" font-weight="800">🎯 Zero Hype</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Clean, respectful educational</text>
    <text x="20" y="76" fill="#94a3b8" font-family="sans-serif" font-size="11.5">labels without marketing jargon.</text>
  </g>

  <g transform="translate(295, 95)">
    <rect width="235" height="115" rx="12" fill="url(#cardP)" stroke="#ff007a" stroke-width="1.2" />
    <text x="20" y="32" fill="#ff007a" font-family="sans-serif" font-size="15" font-weight="800">⚡ Offline-Ready</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Self-contained lesson files</text>
    <text x="20" y="76" fill="#94a3b8" font-family="sans-serif" font-size="11.5">operate seamlessly anywhere.</text>
  </g>

  <g transform="translate(550, 95)">
    <rect width="235" height="115" rx="12" fill="url(#cardP)" stroke="#00ff66" stroke-width="1.2" />
    <text x="20" y="32" fill="#00ff66" font-family="sans-serif" font-size="15" font-weight="800">🔒 Discreet Admin</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Teacher controls &amp; PIN stay</text>
    <text x="20" y="76" fill="#94a3b8" font-family="sans-serif" font-size="11.5">unobtrusive to students.</text>
  </g>

  <g transform="translate(805, 95)">
    <rect width="255" height="115" rx="12" fill="url(#cardP)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="20" y="32" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="800">📱 Mobile Responsive</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Fluid clamp typography and</text>
    <text x="20" y="76" fill="#94a3b8" font-family="sans-serif" font-size="11.5">48px+ touch targets.</text>
  </g>
