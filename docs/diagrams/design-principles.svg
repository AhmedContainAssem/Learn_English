<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <rect width="960" height="300" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="38" fill="#00ff9d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">CORE DESIGN PRINCIPLES</text>
  
  <g transform="translate(40, 65)">
    <!-- Principle 1 -->
    <rect x="0" y="0" width="205" height="205" rx="8" fill="#131b2e" stroke="#00f3ff" stroke-width="1"/>
    <text x="20" y="35" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="bold">Zero Marketing Slop</text>
    <text x="20" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11.5">No hype words, false</text>
    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11.5">claims, or promotional</text>
    <text x="20" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11.5">clutter. Clean, calm</text>
    <text x="20" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11.5">pedagogical labels only.</text>
    <text x="20" y="175" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">RULE 1 COMPLIANT</text>

    <!-- Principle 2 -->
    <rect x="225" y="0" width="205" height="205" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1"/>
    <text x="245" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Zero Purple Rule</text>
    <text x="245" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Strict prohibition of</text>
    <text x="245" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11.5">magenta, violet &amp; purple.</text>
    <text x="245" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11.5">High-contrast cyan, sky</text>
    <text x="245" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11.5">blue &amp; emerald palette.</text>
    <text x="245" y="175" fill="#00ff9d" font-family="sans-serif" font-size="10" font-weight="bold">RULE 6 ENFORCED</text>

    <!-- Principle 3 -->
    <rect x="450" y="0" width="205" height="205" rx="8" fill="#131b2e" stroke="#00ff9d" stroke-width="1"/>
    <text x="470" y="35" fill="#00ff9d" font-family="sans-serif" font-size="14" font-weight="bold">Mobile Zero-Overflow</text>
    <text x="470" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Cards over static tables.</text>
    <text x="470" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Responsive CSS grid with</text>
    <text x="470" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11.5">minmax(min(100%, 280px), 1fr)</text>
    <text x="470" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11.5">guarantees zero spillover.</text>
    <text x="470" y="175" fill="#00ff9d" font-family="sans-serif" font-size="10" font-weight="bold">RULE 5 COMPLIANT</text>

    <!-- Principle 4 -->
    <rect x="675" y="0" width="205" height="205" rx="8" fill="#131b2e" stroke="#ffb703" stroke-width="1"/>
    <text x="695" y="35" fill="#ffb703" font-family="sans-serif" font-size="14" font-weight="bold">Golden Ref Parity</text>
    <text x="695" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11.5">All grade lessons inherit</text>
    <text x="695" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11.5">exact proven DOM structure,</text>
    <text x="695" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11.5">CSS includes, and engine</text>
    <text x="695" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11.5">contracts from Sec 1 L1.</text>
    <text x="695" y="175" fill="#ffb703" font-family="sans-serif" font-size="10" font-weight="bold">STRICT CONTRACT</text>
  </g>
</svg>