    <text x="95" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Explore definitions &amp;</text>
    <text x="95" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">real-life examples</text>

    <!-- Arrow 1 -->
    <polygon points="205,80 220,80 220,76 230,83 220,90 220,86 205,86" fill="#38bdf8"/>

