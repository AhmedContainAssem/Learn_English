    <text x="335" y="41" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="335" y="78" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Read Storybook</text>
    <text x="335" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dual-page 3D reader</text>
    <text x="335" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Realistic scene photos</text>
    <text x="335" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Narrator voice autoplay</text>

    <!-- Arrow 2 -->
    <polygon points="445,80 460,80 460,76 470,83 460,90 460,86 445,86" fill="#00ff9d"/>

    <!-- Step 3 -->
    <rect x="480" y="0" width="190" height="160" rx="10" fill="#131b2e" stroke="#00ff9d" stroke-width="1.2"/>
    <circle cx="575" cy="35" r="18" fill="#1c2a47" stroke="#00ff9d" stroke-width="1.5"/>
    <text x="575" y="41" fill="#00ff9d" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="575" y="78" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Test in Quiz</text>
    <text x="575" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Adaptive question flow</text>
    <text x="575" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Synthetic audio cues</text>
    <text x="575" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Question option shuffle</text>

