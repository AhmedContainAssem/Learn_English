<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <rect width="960" height="280" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">STUDENT INTERACTION &amp; LEARNING WORKFLOW</text>
  
  <g transform="translate(40, 75)">
    <!-- Step 1 -->
