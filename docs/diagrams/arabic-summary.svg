<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="bgAr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanAr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardAr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1100" height="480" fill="url(#bgAr)" rx="16" />

  <!-- Arabic Title Header -->
  <text x="550" y="42" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">المنظومة التعليمية التفاعلية</text>
  <text x="550" y="78" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">🇪🇬 منصة تعلم اللغة الإنجليزية - Eng. &amp; Mr. Ahmed Assem</text>

  <!-- 4 Pillars in Arabic -->
  <g transform="translate(40, 105)">
    <rect width="235" height="150" rx="12" fill="url(#cardAr)" stroke="#00f3ff" stroke-width="1.2" />
    <text x="215" y="38" font-size="20">🎨</text>
    <text x="180" y="38" fill="#00f3ff" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="end">استوديو الدروس</text>
    <text x="215" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">محرر بصري تفاعلي</text>
    <text x="215" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">بناء وتعديل الدروس مع</text>
    <text x="215" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">محاكي حي ونشر مباشر لـ GitHub.</text>
  </g>

  <g transform="translate(295, 105)">
    <rect width="235" height="150" rx="12" fill="url(#cardAr)" stroke="#ff007a" stroke-width="1.2" />
    <text x="215" y="38" font-size="20">📚</text>
    <text x="180" y="38" fill="#ff007a" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="end">7 أنماط تعليمية</text>
    <text x="215" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">تغطية شاملة للمناهج</text>
    <text x="215" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">تبويبات المنهج، القصص 3D،</text>
    <text x="215" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">الفلاش كارد، والكويزات المباشرة.</text>
  </g>

  <g transform="translate(550, 105)">
    <rect width="235" height="150" rx="12" fill="url(#cardAr)" stroke="#00ff66" stroke-width="1.2" />
    <text x="215" y="38" font-size="20">🔊</text>
    <text x="180" y="38" fill="#00ff66" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="end">نطق صوتي فوري</text>
    <text x="215" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">Web Speech TTS</text>
    <text x="215" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">نطق إنجليزي فائق الدقة مع</text>
    <text x="215" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">مؤثرات صوتية وترددات للألعاب.</text>
  </g>

  <g transform="translate(805, 105)">
    <rect width="255" height="150" rx="12" fill="url(#cardAr)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="235" y="38" font-size="20">⚡</text>
    <text x="200" y="38" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="end">بدون خوادم Jamstack</text>
    <text x="235" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">ملفات ذاتية الاحتواء</text>
    <text x="235" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">تعمل بدون إنترنت 100%</text>
    <text x="235" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11.5" text-anchor="end">مع حفظ البيانات داخلياً كـ JSON.</text>
  </g>

  <!-- Educator and Mission Card -->
  <g transform="translate(40, 280)">
    <rect width="1020" height="165" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <circle cx="940" cy="82" r="45" fill="#1e293b" stroke="#00f3ff" stroke-width="2" />
    <text x="940" y="92" font-size="34" text-anchor="middle">👨‍🏫</text>
    
    <text x="860" y="55" fill="#00f3ff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="end">إعداد وتطوير: Eng. &amp; Mr. Ahmed Assem</text>
    <text x="860" y="85" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">مهندس برمجيات ومعلم لغة إنجليزية وخبير في بناء المنظومات التعليمية التفاعلية.</text>
    <text x="860" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end">المنصة مفتوحة المصدر بالكامل ومتاحة للجميع تحت رخصة MIT لخدمة أبنائنا الطلاب وزملائنا المعلمين.</text>
    
    <!-- Badges -->
    <rect x="50" y="120" width="120" height="26" rx="13" fill="#065f46" />
    <text x="110" y="137" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">رخصة MIT الحرة</text>

    <rect x="185" y="120" width="140" height="26" rx="13" fill="#1e3a8a" />
    <text x="255" y="137" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">مراحل التعليم المصرية</text>
  </g>
</svg>
