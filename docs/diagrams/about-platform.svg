<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1100" height="360" fill="url(#bgAbout)" rx="16" />

  <text x="550" y="38" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3">PLATFORM VISION</text>
  <text x="550" y="66" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">📖 WHAT IS LEARN ENGLISH PLATFORM?</text>

  <!-- Big Feature Box -->
  <g transform="translate(50, 95)">
    <rect width="1000" height="235" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Feature 1 -->
    <g transform="translate(40, 25)">
      <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#00f3ff" stroke-width="1.5" />
      <text x="20" y="27" font-size="16" text-anchor="middle">🔊</text>
      <text x="55" y="18" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="800">Isolated Text-to-Speech Engine</text>
      <text x="55" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Target-triggered native pronunciation for words, definitions, dialogues, and reading pages.</text>
    </g>

