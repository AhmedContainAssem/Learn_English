      <text x="20" y="27" font-size="16" text-anchor="middle">🎮</text>
      <text x="55" y="18" fill="#ff007a" font-family="sans-serif" font-size="14" font-weight="800">Gamified Interactive Assessment</text>
      <text x="55" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Instant visual feedback, major chord chimes, wrong-answer buzzer, and animated scores.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(40, 125)">
