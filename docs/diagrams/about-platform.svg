<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <rect width="960" height="300" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="38" fill="#00ff9d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">WHAT IS LEARN ENGLISH PLATFORM?</text>
  <g transform="translate(50, 65)">
    <rect width="860" height="205" rx="10" fill="#131b2e" stroke="#1c2a47" stroke-width="1.5"/>
    <text x="40" y="40" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700">A Focused, High-Performance Pedagogical Web Environment</text>
    <text x="40" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="13" line-height="24">
      Built specifically for Egyptian national English curricula (Thanawiya Amma, Secondary 1-2, Preparatory 3).
    </text>
    <text x="40" y="94" fill="#94a3b8" font-family="sans-serif" font-size="13">
      The platform eliminates bloated frameworks and complex server runtimes, delivering lightning-fast,
    </text>
    <text x="40" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13">
      self-contained static lesson experiences directly inside the student's web browser.
    </text>

    <!-- Key Bullet Points -->
    <g transform="translate(40, 145)">
      <circle cx="6" cy="6" r="4" fill="#00f3ff"/>
      <text x="20" y="10" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Zero Setup Requirement — Double click any lesson to study immediately</text>

      <circle cx="450" cy="6" r="4" fill="#00ff9d"/>
      <text x="464" y="10" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Full Audio Pronunciation via Native Web Speech API</text>

      <circle cx="6" cy="34" r="4" fill="#38bdf8"/>
      <text x="20" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Mobile Responsive Grid — Zero horizontal scroll or table cut-off</text>

      <circle cx="450" cy="34" r="4" fill="#ffb703"/>
      <text x="464" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Teacher Lesson Studio with Secure Local Passcode Verification</text>
    </g>
  </g>
</svg>