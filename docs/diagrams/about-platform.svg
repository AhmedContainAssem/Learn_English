    <!-- Feature 4 -->
    <g transform="translate(40, 175)">
      <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <text x="20" y="27" font-size="16" text-anchor="middle">🛠️</text>
      <text x="55" y="18" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="800">Discreet Teacher Studio (/admin)</text>
      <text x="55" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Complete visual authoring suite with live simulator, pedagogical linter, and GitHub PAT sync.</text>
