<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" fill="url(#bgGradient)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="180" r="140" fill="#00f3ff" opacity="0.07" filter="url(#glowCyan)" />
  <circle cx="950" cy="280" r="150" fill="#ff007a" opacity="0.06" filter="url(#glowCyan)" />

  <!-- Badge Top -->
  <rect x="470" y="38" width="260" height="34" rx="17" fill="#1e293b" stroke="#00f3ff" stroke-width="1.5" />
  <text x="600" y="60" fill="#00f3ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">E-LEARNING ECOSYSTEM</text>

  <!-- Hero Main Title -->
  <text x="600" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="1">
    LEARN ENGLISH PLATFORM
  </text>
  <text x="600" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle">
    Modern Interactive Curriculum · 3D Storybook Reader · Live Studio &amp; TTS Engine
  </text>

  <!-- 4 Feature Floating Cards -->
  <!-- Card 1 -->
  <g transform="translate(60, 220)">
    <rect width="250" height="200" rx="16" fill="url(#glassCard)" stroke="#00f3ff" stroke-width="1.2" />
    <circle cx="50" cy="50" r="24" fill="#0f172a" stroke="#00f3ff" stroke-width="1.5" />
    <text x="50" y="58" font-size="22" text-anchor="middle">🛠️</text>
    <text x="50" y="105" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Teacher Studio</text>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">Visual lesson builder with</text>
    <text x="50" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">instant live simulator.</text>
    <rect x="25" y="170" width="100" height="6" rx="3" fill="url(#cyanNeon)" />
  </g>

  <!-- Card 2 -->
  <g transform="translate(340, 220)">
    <rect width="250" height="200" rx="16" fill="url(#glassCard)" stroke="#ff007a" stroke-width="1.2" />
    <circle cx="50" cy="50" r="24" fill="#0f172a" stroke="#ff007a" stroke-width="1.5" />
    <text x="50" y="58" font-size="22" text-anchor="middle">📖</text>
    <text x="50" y="105" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">3D Storybook</text>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">Dual-page book reader</text>
    <text x="50" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">with auto voice storyteller.</text>
    <rect x="25" y="170" width="100" height="6" rx="3" fill="url(#pinkNeon)" />
  </g>

  <!-- Card 3 -->
  <g transform="translate(620, 220)">
    <rect width="250" height="200" rx="16" fill="url(#glassCard)" stroke="#00ff66" stroke-width="1.2" />
    <circle cx="50" cy="50" r="24" fill="#0f172a" stroke="#00ff66" stroke-width="1.5" />
    <text x="50" y="58" font-size="22" text-anchor="middle">🔊</text>
    <text x="50" y="105" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Web Speech TTS</text>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">Crystal clear pronunciation</text>
    <text x="50" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">&amp; Web Audio FX.</text>
    <rect x="25" y="170" width="100" height="6" rx="3" fill="url(#emeraldNeon)" />
  </g>

  <!-- Card 4 -->
  <g transform="translate(900, 220)">
    <rect width="250" height="200" rx="16" fill="url(#glassCard)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="50" cy="50" r="24" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="50" y="58" font-size="22" text-anchor="middle">🎯</text>
    <text x="50" y="105" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Gamified Quiz</text>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">Immediate score rewards,</text>
    <text x="50" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">chimes &amp; shuffle logic.</text>
    <rect x="25" y="170" width="100" height="6" rx="3" fill="url(#pinkNeon)" />
  </g>
</svg>
