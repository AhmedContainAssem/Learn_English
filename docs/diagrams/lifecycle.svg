<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <rect width="960" height="280" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="38" fill="#00ff9d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">LESSON STATE LIFECYCLE</text>
  <g transform="translate(40, 75)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#131b2e" stroke="#00f3ff" stroke-width="1"/>
    <text x="100" y="30" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. DOMContentLoaded</text>
    <text x="100" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Parse window.lessonData</text>
    <text x="100" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Attach tabs event handlers</text>
    <text x="100" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Bidi layout enforcement</text>
    <text x="100" y="125" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">INIT COMPLETE</text>

    <!-- Stage 2 -->
    <rect x="230" y="0" width="200" height="150" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1"/>
    <text x="330" y="30" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Engine Binding</text>
    <text x="330" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">storyEngine.loadPages()</text>
    <text x="330" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">quizEngine.init()</text>
    <text x="330" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Audio synthesizer preload</text>
    <text x="330" y="125" fill="#00ff9d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ENGINES READY</text>

    <!-- Stage 3 -->
    <rect x="460" y="0" width="200" height="150" rx="8" fill="#131b2e" stroke="#00ff9d" stroke-width="1"/>
    <text x="560" y="30" fill="#00ff9d" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Student Interaction</text>
    <text x="560" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Tab navigation switching</text>
    <text x="560" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Audio clicks &amp; speech triggers</text>
    <text x="560" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Quiz answers selection</text>
    <text x="560" y="125" fill="#ffb703" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ACTIVE LEARNING</text>

    <!-- Stage 4 -->
    <rect x="690" y="0" width="190" height="150" rx="8" fill="#131b2e" stroke="#ffb703" stroke-width="1"/>
    <text x="785" y="30" fill="#ffb703" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. State Persistence</text>
    <text x="785" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Save high scores in</text>
    <text x="785" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">browser localStorage</text>
    <text x="785" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Graceful incognito fallback</text>
    <text x="785" y="125" fill="#00ff9d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SAFE CLIENT STATE</text>
  </g>
</svg>