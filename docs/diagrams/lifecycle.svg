<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="circleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <marker id="arrowCycle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f3ff" />
    </marker>
  </defs>

  <rect width="1100" height="480" fill="url(#bgLife)" rx="16" />

  <!-- Section Header -->
  <text x="550" y="45" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">LESSON STATE LIFECYCLE</text>
  <text x="550" y="80" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">Continuous Ingestion, Authoring &amp; Distribution Cycle</text>

  <!-- Cycle Nodes -->
  <!-- Node 1: Ingest / Open -->
  <g transform="translate(100, 160)">
    <circle cx="80" cy="80" r="70" fill="#111827" stroke="#00f3ff" stroke-width="2" />
    <circle cx="80" cy="50" r="20" fill="url(#circleCyan)" />
    <text x="80" y="56" fill="#090d16" font-size="16" font-weight="900" text-anchor="middle">1</text>
    <text x="80" y="95" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">INGESTION</text>
    <text x="80" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Parse Legacy HTML</text>
    <text x="80" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">or Fresh Preset</text>
  </g>

  <!-- Node 2: Modify and Auto-Save -->
  <g transform="translate(360, 160)">
    <circle cx="80" cy="80" r="70" fill="#111827" stroke="#ff007a" stroke-width="2" />
    <circle cx="80" cy="50" r="20" fill="#ff007a" />
    <text x="80" y="56" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">2</text>
    <text x="80" y="95" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">EDIT &amp; AUDIT</text>
    <text x="80" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Live State Changes</text>
    <text x="80" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Linter Audit &amp; Score</text>
  </g>

  <!-- Node 3: Simulation -->
  <g transform="translate(620, 160)">
    <circle cx="80" cy="80" r="70" fill="#111827" stroke="#00ff66" stroke-width="2" />
    <circle cx="80" cy="50" r="20" fill="#00ff66" />
    <text x="80" y="56" fill="#090d16" font-size="16" font-weight="900" text-anchor="middle">3</text>
    <text x="80" y="95" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">SIMULATION</text>
    <text x="80" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Real-time Sandbox</text>
    <text x="80" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Audio &amp; Quiz Test</text>
  </g>

  <!-- Node 4: Generation and Publish -->
  <g transform="translate(880, 160)">
    <circle cx="80" cy="80" r="70" fill="#111827" stroke="#a855f7" stroke-width="2" />
    <circle cx="80" cy="50" r="20" fill="#a855f7" />
    <text x="80" y="56" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">4</text>
    <text x="80" y="95" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PUBLISH</text>
    <text x="80" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Self-Contained File</text>
    <text x="80" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">GitHub Direct Sync</text>
  </g>

  <!-- Connectors -->
  <line x1="240" y1="240" x2="360" y2="240" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCycle)" />
  <line x1="500" y1="240" x2="620" y2="240" stroke="#ff007a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCycle)" />
  <line x1="760" y1="240" x2="880" y2="240" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCycle)" />

  <!-- Loop back path -->
  <path d="M 960 310 C 960 410, 160 410, 160 310" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrowCycle)" />
  <text x="550" y="390" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Re-edit Anytime (Full State Preserved in HTML Payload)</text>
</svg>
