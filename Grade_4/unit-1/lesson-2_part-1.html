    <title>Unit 1 - Lesson 2: Healthy Habits (Part 1)</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="container" style="max-width: 650px;">
        <div class="breadcrumb" style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 15px;">
            <span>الصف الرابع الابتدائي</span> / <span>الوحدة الأولى</span> / <span>الدرس الثاني (الجزء 1)</span>
        </div>

        <div style="text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;">
            <h1 id="title" class="title" style="font-size: 1.8rem; margin-bottom: 8px;">Unit 1 - Lesson 2</h1>
            <p id="description" class="subtitle" style="margin-bottom: 0;">اختر العادة الصحية الصحيحة المناسبة للصورة والتعريف!</p>
        </div>

        <div class="score-board">
            <span>السؤال: <span id="current-q">1</span> / <span id="total-q">7</span></span>
            <span>النقاط: <span id="score">0</span> 🌟</span>
        </div>

        <div class="question-card" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 20px; text-align: center;">
            <span class="emoji-display" id="emoji" style="font-size: 3.5rem; display: block; margin-bottom: 15px;">🪥🦷</span>
            <div class="question-text" id="question" style="font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); line-height: 1.5;">جاري تحميل السؤال...</div>
            <div class="options-grid" id="options" style="display: flex; flex-direction: column; gap: 12px;"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="nav-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <a href="./index.html" class="back-btn" data-sound-click="click">⬅ العودة لقائمة الدروس</a>
            <button class="action-btn next-btn" id="next-btn" onclick="nextQuestion()" style="display: none;">السؤال التالي ➔</button>
        </div>
    </div>
