<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كورسات التأسيس - Mr. Ahmed Assem</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="index-page">

    <div class="container">
        <div class="teacher-profile-header">
            <div class="avatar-wrapper">
                <img src="../my-photo-profile.png" alt="Mr. Ahmed Assem" class="teacher-avatar">
            </div>
            <h1 class="page-title">📚 كورسات التأسيس (Courses)</h1>
            <div class="slogan">✨ Easy Peasy Ya Englezeey ✨</div>
        </div>

        <div class="subtitle">اختر المستوى الدراسي للبدء في الدروس والتمارين</div>

        <div class="courses-list">
            <a href="A1/index.html" class="course-card active" data-sound-click="click">
                <div class="card-main-info">
                    <span class="card-icon">🚀</span>
                    <div class="card-text-group">
                        <span class="grade-title">Level A1 (المستوى التأسيسي الأول)</span>
                        <span class="grade-en-tag">Beginner • Grammar & Vocab & Dialogue</span>
                    </div>
                </div>
                <span class="badge badge-active">🎯 متاح</span>
            </a>
            <div class="course-card locked">
                <div class="card-main-info">
                    <span class="card-icon">⚡</span>
                    <div class="card-text-group">
                        <span class="grade-title">Level A2 (المستوى التأسيسي الثاني)</span>
                        <span class="grade-en-tag">Elementary • Fluency & Expression</span>
                    </div>
                </div>
                <span class="badge lock-badge">🔒 قريباً</span>
            </div>
        </div>

        <div class="nav-controls">
            <a href="../index.html" class="back-btn" data-sound-click="click">⬅️ العودة للقائمة الرئيسية</a>
        </div>
    </div>

    <script src="../assets/js/ui.js"></script>
</body>
</html>
